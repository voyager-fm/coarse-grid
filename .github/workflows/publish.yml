name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Preflight: tag matches package version"
        if: github.event_name != 'workflow_dispatch'
        run: |
          [ "$GITHUB_REF_NAME" = "v$(node -p "require('./packages/core/package.json').version")" ]

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        run: pnpm --filter @voyager-fm/coarse-grid-core build

      - name: Publish core package to GitHub Packages
        run: pnpm --filter @voyager-fm/coarse-grid-core publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
